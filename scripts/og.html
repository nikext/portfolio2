<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG image template</title>
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/space-grotesk/index.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource/jetbrains-mono/500.css" />
    <style>
      html,
      body {
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: #07090f;
        color: #e9edf5;
        font-family: 'Inter Variable', system-ui, sans-serif;
      }
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(700px 500px at 82% 30%, rgba(103, 232, 249, 0.16), transparent 62%),
          radial-gradient(600px 420px at 8% 100%, rgba(167, 139, 250, 0.16), transparent 60%);
      }
      .copy {
        position: absolute;
        left: 84px;
        top: 84px;
        width: 660px;
      }
      .eyebrow {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #67e8f9;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #86efac;
        box-shadow: 0 0 0 6px rgba(134, 239, 172, 0.18);
      }
      h1 {
        font-family: 'Space Grotesk Variable', 'Inter Variable', sans-serif;
        font-weight: 600;
        font-size: 60px;
        line-height: 1.06;
        letter-spacing: -0.02em;
        margin: 22px 0 0;
      }
      h1 span {
        color: #67e8f9;
      }
      p {
        margin: 26px 0 0;
        font-size: 24px;
        line-height: 1.4;
        color: #b9c1cf;
        max-width: 600px;
      }
      .foot {
        position: absolute;
        left: 84px;
        bottom: 56px;
        display: flex;
        gap: 36px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 19px;
        color: #8a93a5;
        letter-spacing: 0.04em;
      }
      .mark {
        position: absolute;
        right: 84px;
        top: 90px;
        width: 380px;
        height: 380px;
      }
      .brand {
        position: absolute;
        right: 84px;
        bottom: 64px;
        font-family: 'Space Grotesk Variable', sans-serif;
        font-weight: 600;
        font-size: 24px;
        text-align: right;
      }
      .brand small {
        display: block;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        font-size: 14px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #8a93a5;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <svg class="mark" viewBox="0 0 400 400" fill="none">
      <defs>
        <radialGradient id="core" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.55" />
          <stop offset="70%" stop-color="#a78bfa" stop-opacity="0.12" />
          <stop offset="100%" stop-color="#a78bfa" stop-opacity="0" />
        </radialGradient>
      </defs>
      <circle cx="200" cy="200" r="118" fill="url(#core)" />
      <g stroke="#67e8f9" stroke-opacity="0.35" stroke-width="1.2">
        <polygon points="200,54 326,127 326,273 200,346 74,273 74,127" />
        <polygon points="200,54 326,273 74,273" />
        <polygon points="200,346 326,127 74,127" />
        <polyline points="74,127 200,200 326,127" />
        <polyline points="74,273 200,200 326,273" />
        <line x1="200" y1="54" x2="200" y2="346" />
        <ellipse
          cx="200"
          cy="200"
          rx="185"
          ry="62"
          transform="rotate(-28 200 200)"
          stroke-opacity="0.55"
        />
      </g>
      <g fill="#e0f7ff">
        <circle cx="200" cy="54" r="7" />
        <circle cx="326" cy="127" r="7" />
        <circle cx="326" cy="273" r="7" />
        <circle cx="200" cy="346" r="7" />
        <circle cx="74" cy="273" r="7" />
        <circle cx="74" cy="127" r="7" />
        <circle cx="200" cy="200" r="9" fill="#67e8f9" />
        <circle cx="140" cy="150" r="4" />
        <circle cx="262" cy="160" r="4" />
        <circle cx="250" cy="250" r="4" />
        <circle cx="150" cy="252" r="4" />
      </g>
    </svg>
    <div class="copy">
      <div class="eyebrow"><span class="dot"></span>Software Engineer · Zurich area</div>
      <h1>
        AI applications<br />that <span>ship</span>.<br />Production that<br /><span>stays up</span
        >.
      </h1>
      <p>LLM-powered tools and production reliability inside a Swiss digital bank.</p>
    </div>
    <div class="foot"><span>github.com/nikext</span><span>Google Cloud certified</span></div>
    <div class="brand">Nikola Todorovski<small>nikext</small></div>
  </body>
</html>
